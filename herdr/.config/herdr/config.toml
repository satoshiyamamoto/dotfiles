onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false
# herdr-radar drives `name` from the desktop appearance and falls back to
# catppuccin when these are unset.
light_name = "tokyo-night-day"
dark_name = "tokyo-night"

# The Linux login shell stays the distribution's bash -- an LDAP account
# usually cannot chsh -- so a saved herdr machine's server inherits
# SHELL=/bin/bash. A bare name because the profile's zsh lives at a different
# path on macOS and Linux. Login mode because the profile's PATH is set in
# .zprofile; macOS' "auto" already means login.
[terminal]
default_shell = "zsh"
shell_mode = "login"

[keys]
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "85%"

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/home/satoshi_yamamoto/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar${HERDR_SESSION:+-$HERDR_SESSION}.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

prompt_new_tab_name = false
pane_borders = true
pane_gaps = true
agent_panel_sort = "priority"
# tab_bar_right belongs to herdr-radar, which writes it below and refuses to
# install over a hand-written one.

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[experimental]
switch_ascii_input_source_in_prefix = true
kitty_graphics = true

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

# >>> herdr-radar sidebar block
