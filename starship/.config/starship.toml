"$schema" = 'https://starship.rs/config-schema.json'


format = """
[░▒▓](#a3aed2)\
[ 󰀵 ](bg:#a3aed2 fg:#090c0c)\
$hostname\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
$direnv\
[](fg:#769ff0 bg:#394260)\
$git_branch\
${custom.git_worktree}\
$git_status\
[](fg:#394260 bg:#212736)\
$jobs\
[](fg:#212736 bg:#1d2230)\
[ ](fg:#1d2230)\
$fill\
$cmd_duration\
[ ](fg:#1d2230)\
$python\
[](fg:#212736 bg:#1d2230)\
$docker_context\
$kubernetes\
[](fg:#394260 bg:#212736)\
$aws\
$gcloud\
${custom.vpn}\
$battery\
[](fg:#a3aed2 bg:#394260)\
$time\
[▓▒░](#a3aed2)\
\n$character"""


[hostname]
style = "bg:#a3aed2 fg:#090c0c"
format = '[$hostname]($style)'
trim_at = ".local"
ssh_only = true

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
substitutions = [
  { from = "^.*/src/[^/]+(?:/[^/]+)*/([^/]+)/\\.worktrees/[^/]+(/.*)?$", to = "…/$1$2", regex = true },
  { from = "^.*/src/[^/]+/[^/]+/([^/]+)(/.*)?$", to = "…/$1$2", regex = true },
  { from = "Desktop", to = " " },
  { from = "Documents", to = "󰲂 " },
  { from = "Downloads", to = "󰉍 " },
  { from = "Music", to = "󱍙 " },
  { from = "Pictures", to = "󰉏 " },
  { from = "Projects", to = "󱧼 " },
]

[direnv]
disabled = false
symbol = "󱂀 "
style = "fg:#e3e5e5 bg:#769ff0"
format = '[$symbol ]($style)'

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[jobs]
disabled = false
symbol = ""
format = '[ $symbol $number]($style)'
style = "bg:#212736"

[fill]
symbol = " "

[cmd_duration]
format = '[took $duration]($style)'

[python]
disabled = false
symbol = "󰌠"
style = "bg:#1d2230"
format = '[[ $symbol $pyenv_prefix($version) (\($virtualenv\) )](fg:#769ff0 bg:#1d2230)]($style)'

[docker_context]
disabled = true
symbol = "󰡨"
style = "bg:#212736"
format = '[[ $symbol $context ](fg:#769ff0 bg:#212736)]($style)'

[kubernetes]
disabled = true
symbol = "󱃾"
style = "bg:#212736"
format = '[[ $symbol $context( \($namespace\)) ](fg:#769ff0 bg:#212736)]($style)'

[aws]
disabled = false
symbol = " "
style = "fg:#769ff0 bg:#394260"
format = '[ $symbol $profile ]($style)'

[gcloud]
disabled = true
symbol = "󱇶"
style = "fg:#769ff0 bg:#394260"
format = '[ $symbol $project ]($style)'

[battery]
format = "[$symbol[$percentage](fg:#e3e5e5 bg:#394260) ]($style)"

[[battery.display]]
threshold = 20
style = "fg:red bg:#394260"
discharging_symbol = "󰁺 "

[time]
disabled = false
time_format = "%T"
style = "fg:#090c0c bg:#a3aed2"
format = '[ $time  ]($style)'

[custom.git_worktree]
description = "Show an icon when inside a linked git worktree"
command = "printf ''"
when = "test \"$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)\" != \"$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)\""
require_repo = true
symbol = "󰌹 "
style = "fg:#769ff0 bg:#394260"
format = '[$symbol ]($style)'

[custom.vpn]
disabled = true
command = "~/Projects/src/github.com/satoshiyamamoto/starship-vpn/starship-vpn.sh prompt"
when = "~/Projects/src/github.com/satoshiyamamoto/starship-vpn/starship-vpn.sh connected"
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $output ](fg:#769ff0 bg:#394260)]($style)'
ignore_timeout = true
