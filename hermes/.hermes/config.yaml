model:
  default: stepfun/step-3.7-flash:free
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1
agent:
  max_turns: 150
browser:
  cloud_provider: local
  use_gateway: false
display:
  tool_progress: all
tts:
  use_gateway: false
_config_version: 33
fallback_model:
  - provider: nous
    model: tencent/hy3:free
session_reset:
  mode: none
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
known_plugin_toolsets:
  cli:
    - spotify

# ── Skills ────────────────────────────────────────────────────────────
# Personal skills live in the satoshiyamamoto/skills repo, not in
# ~/.hermes/skills — that directory belongs to Hermes (bundled skills,
# hub installs, .hub/ state) and must not be stow-managed. A local path
# needs no auth even though the repo is private, and edits are live.
# Requires the clone at the path below; see CLAUDE.md > Hermes Agent.
skills:
  external_dirs:
    - ~/Projects/src/github.com/satoshiyamamoto/skills/hermes

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true
